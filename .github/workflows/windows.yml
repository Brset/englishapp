name: windows

on:
  push:
    paths: ['windows/**', 'core/**', 'engine/**', '.github/actions/**', 'content/**', 'tools/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'core/**', 'engine/**', '.github/actions/**', 'content/**', 'tools/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build content.db
        run: python tools/build_content_db.py

      # engine/CMakeLists.txt: target pron_engine -> pron_engine.dll (also exports pron_c.h); it downloads
      # onnxruntime / sherpa-onnx / whisper.cpp for win-x64 on configure.
      - name: Build native engine (Release x64)
        run: |
          cmake -S engine -B build/engine -A x64
          cmake --build build/engine --config Release --target pron_engine

      - name: Fetch models
        uses: ./.github/actions/models
        with:
          out: models

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app (self-contained, win-x64)
        run: >
          dotnet publish windows/EnglishApp/EnglishApp.csproj -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true
          -p:ContentDb="${{ github.workspace }}\build\content.db"
          -p:UserSchema="${{ github.workspace }}\content\db\user_schema.sql"
          -o publish

      - name: Bundle native DLLs and models
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Path build/engine -Recurse -Filter *.dll |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' -and $_.FullName -notmatch '\\_deps\\[^\\]+-src\\(test|tests|examples)\\' }
          $names = @{}
          foreach ($d in $dlls) {
            if ($names.ContainsKey($d.Name)) { continue }
            $names[$d.Name] = $true
            Copy-Item $d.FullName publish/ -Force
            Write-Host "native: $($d.FullName)"
          }
          if (-not $names.ContainsKey('pron_engine.dll')) { throw 'pron_engine.dll not found in build/engine' }
          New-Item -ItemType Directory -Force publish/models | Out-Null
          Copy-Item models/* publish/models -Recurse -Force

      - name: Verify bundled files
        shell: pwsh
        run: |
          foreach ($f in 'EnglishApp.exe','pron_engine.dll','onnxruntime.dll','content.db','user_schema.sql','models') {
            if (-not (Test-Path "publish/$f")) { throw "missing $f in publish output" }
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath EnglishApp-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishApp-win-x64
          path: EnglishApp-win-x64.zip
