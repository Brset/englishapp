name: windows

# Manual / release-tag builds only: GitHub Actions minutes on this private repo are limited.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build content.db
        run: python tools/build_content_db.py

      # engine/CMakeLists.txt: target pron_engine -> pron_engine.dll (also exports pron_c.h); it downloads
      # onnxruntime / sherpa-onnx / whisper.cpp for win-x64 on configure.
      - name: Build native engine (Release x64)
        run: |
          cmake -S engine -B build/engine -A x64
          cmake --build build/engine --config Release --target pron_engine

      - name: Fetch models
        uses: ./.github/actions/models
        with:
          out: models

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app (self-contained, win-x64)
        run: >
          dotnet publish windows/EnglishApp/EnglishApp.csproj -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true
          -p:ContentDb="${{ github.workspace }}\build\content.db"
          -p:UserSchema="${{ github.workspace }}\content\db\user_schema.sql"
          -o publish

      - name: Bundle native DLLs and models
        shell: pwsh
        run: |
          # engine/CMakeLists.txt copies sherpa-onnx's onnxruntime.dll / sherpa-onnx-c-api.dll / providers next to
          # pron_engine.dll (build/engine/Release). whisper/ggml are static, so no ggml DLLs. Do NOT glob the whole
          # build tree: it also holds the official onnxruntime.dll (import-lib donor) which must not win.
          $dir = 'build/engine/Release'
          $dlls = Get-ChildItem -Path $dir -Filter *.dll
          foreach ($d in $dlls) { Copy-Item $d.FullName publish/ -Force; Write-Host "native: $($d.Name)" }
          foreach ($n in 'pron_engine.dll','onnxruntime.dll','sherpa-onnx-c-api.dll') {
            if (-not (Test-Path "publish/$n")) { throw "$n not found in $dir" }
          }
          if (-not (Test-Path 'publish/onnxruntime_providers_shared.dll')) { Write-Warning 'onnxruntime_providers_shared.dll not in the sherpa-onnx archive (CPU-only use is fine)' }
          New-Item -ItemType Directory -Force publish/models | Out-Null
          Copy-Item models/* publish/models -Recurse -Force

      - name: Verify bundled files
        shell: pwsh
        run: |
          foreach ($f in 'EnglishApp.exe','pron_engine.dll','onnxruntime.dll','sherpa-onnx-c-api.dll','content.db','user_schema.sql','models') {
            if (-not (Test-Path "publish/$f")) { throw "missing $f in publish output" }
          }

      - name: Bundle VC++ runtime from VS redist
        shell: pwsh
        run: |
          $redist = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $redist) { Write-Warning 'VS redist CRT folder not found'; return }
          foreach ($n in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            if (Test-Path "$($redist.FullName)\$n") { Copy-Item "$($redist.FullName)\$n" publish/ -Force; Write-Host "vcrt: $n" }
          }

      # Upload the folder itself: GitHub zips artifacts once. Zipping it ourselves first produced a
      # zip-inside-a-zip (~600 MB) that Windows Explorer failed to extract ("data error").
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishApp-win-x64
          path: publish/
          if-no-files-found: error
          compression-level: 6

      # Single, standard zip as a release asset (7-Zip is preinstalled on the runner).
      - name: Publish zip as a GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-${{ github.run_number }}"
          Push-Location publish
          7z a -tzip "..\EnglishApp-$tag.zip" * | Out-Null
          Pop-Location
          $short = (git rev-parse --short HEAD)
          gh release create $tag "EnglishApp-$tag.zip" --target "${{ github.sha }}" --title "Windows ${{ github.run_number }} ($short)" --notes "Unzip the whole archive and run EnglishApp.exe. Commit ${{ github.sha }}."

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify bundle contents and DLL imports
        shell: pwsh
        run: python tools/ci/check_win_bundle.py publish --engine-dir build/engine/Release
        # Runs after the upload so a bug in a check never withholds the build.

      - name: Launch smoke test
        if: always()
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'publish/EnglishApp.exe').Path
          $start = Get-Date
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if (-not $p.HasExited) {
            Write-Host "PASS: EnglishApp.exe still running after 25 s (pid $($p.Id))"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "FAIL: EnglishApp.exe exited early with code $($p.ExitCode)"
            Write-Host '--- Application event log ---'
            Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match '\.NET Runtime|Application Error|Windows Error Reporting|SideBySide' -or $_.TimeCreated -ge $start } |
              ForEach-Object { "[$($_.TimeCreated)] $($_.ProviderName) ($($_.Id)): $($_.Message)"; '' }
            Write-Host '--- crash logs under %LOCALAPPDATA%\EnglishApp ---'
            Get-ChildItem "$env:LOCALAPPDATA\EnglishApp" -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 200 }
            exit 1
          }
