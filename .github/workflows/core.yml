name: core

on:
  push:
    paths: ['core/**', 'engine/**', 'backends/**', 'models/**', 'content/**', 'tools/**', '.github/workflows/core.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate content and build content.db
        run: |
          pip install jsonschema
          python tools/validate_texts.py
          python content/sounds/_validate.py
          python -m unittest tools/test_build_content_db.py
          python tools/build_content_db.py
      - name: Build and test core
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release -DPRON_BUILD_SHARED=ON
          cmake --build build/core --config Release -j 4
          ctest --test-dir build/core -C Release --output-on-failure

  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch models
        uses: ./.github/actions/models
        with:
          out: models
      - name: Configure engine
        run: cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release
        if: runner.os != 'Windows'
      - name: Configure engine (Windows)
        run: cmake -S engine -B build/engine -A x64
        if: runner.os == 'Windows'
      - name: Build engine
        run: cmake --build build/engine --config Release -j 4
      - name: Test engine
        run: ctest --test-dir build/engine -C Release --output-on-failure
      - name: Engine status (real models)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=build/engine/Release/pron_cli.exe; else CLI=build/engine/pron_cli; fi
          mkdir -p selftest-out
          set -o pipefail
          "$CLI" status models | tee selftest-out/status.txt   # includes phoneme_vocab {size,mapped,unmapped}
      - name: Engine selftest (real models)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CLI=build/engine/Release/pron_cli.exe; else CLI=build/engine/pron_cli; fi
          mkdir -p selftest-out && cd selftest-out
          set -o pipefail
          "../$CLI" selftest ../models 2>&1 | tee selftest.txt
      - name: Upload selftest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-selftest-${{ runner.os }}
          path: |
            selftest-out/selftest.txt
            selftest-out/status.txt
            selftest-out/selftest_us.wav
          if-no-files-found: warn
