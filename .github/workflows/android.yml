name: android

# Manual / release-tag builds only: GitHub Actions minutes on this private repo are limited.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build content DB
        run: python tools/build_content_db.py

      - name: Fetch models
        uses: ./.github/actions/models
        with:
          out: models

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug -Pabi=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishApp-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Plain .apk download (no zip): phones often fail to extract a 500 MB artifact zip.
      - name: Publish APK as a GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "EnglishApp-${TAG}.apk"
          gh release create "$TAG" "EnglishApp-${TAG}.apk" --target "${{ github.sha }}" \
            --title "Android ${{ github.run_number }} ($(git rev-parse --short HEAD))" \
            --notes "Debug APK with bundled models, commit ${{ github.sha }}. Download the .apk and install it."

      - name: Verify built APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          python tools/ci/check_apk.py "$APK" \
            --readelf "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
